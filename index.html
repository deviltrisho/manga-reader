<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0b0e11; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }
        header { padding: 10px; background: #151921; border-bottom: 1px solid #2d3748; text-align: center; position: sticky; top: 0; z-index: 10; font-size: 14px; }
        .reader-container { display: flex; flex-direction: column; width: 100%; }
        .manga-page { width: 100%; height: auto; display: block; background: #000; }
        .info-msg { text-align: center; padding: 50px 20px; color: #718096; }
    </style>
</head>
<body>
<header id="header-status">ARCANUM LIBRARY</header>
<div class="reader-container" id="viewer"><div class="info-msg">Синхронизация...</div></div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();
    tg.ready();

    function render() {
        const params = new URLSearchParams(window.location.search);
        const urlsParam = params.get('urls');
        const viewer = document.getElementById('viewer');
        
        if (urlsParam && urlsParam.trim() !== "") {
            viewer.innerHTML = '';
            const urls = urlsParam.split(',');
            urls.forEach((url) => {
                if(url.length > 5) {
                    const img = document.createElement('img');
                    img.src = url.trim();
                    img.className = 'manga-page';
                    viewer.appendChild(img);
                }
            });
            document.getElementById('header-status').innerText = `СТРАНИЦ: ${urls.length}`;
        } else {
            viewer.innerHTML = '<div class="info-msg">Библиотека пуста.<br>Обновите список через команду /read</div>';
        }
    }

    // Запуск рендера при открытии
    render();

    // Сообщаем Telegram, что страница обновилась
    tg.onEvent('mainButtonClicked', function(){ render(); });
</script>
</body>
</html>
