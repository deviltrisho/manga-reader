<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0b0e11; --text: #ffffff; }
        body { 
            background: var(--bg); 
            color: var(--text); 
            font-family: sans-serif; 
            margin: 0; 
            padding: 0; 
            overscroll-behavior: none;
        }
        header { 
            padding: 10px; 
            background: #151921; 
            border-bottom: 1px solid #2d3748; 
            text-align: center; 
            position: sticky; 
            top: 0; 
            z-index: 10;
            font-size: 14px;
            letter-spacing: 1px;
        }
        .reader-container { 
            display: flex; 
            flex-direction: column; 
            width: 100%; 
        }
        .manga-page { 
            width: 100%; 
            height: auto; 
            display: block;
            margin: 0;
            padding: 0;
            background: #000;
        }
        .info-msg {
            text-align: center;
            padding: 50px 20px;
            color: #718096;
        }
        /* Убираем синее выделение при нажатии на мобилках */
        * { -webkit-tap-highlight-color: transparent; }
    </style>
</head>
<body>

<header id="header-status">ARCANUM LIBRARY</header>

<div class="reader-container" id="viewer">
    <div class="info-msg">Загрузка страниц...</div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand(); // Разворачиваем на весь экран
    tg.ready();

    // Получаем параметры из URL
    const params = new URLSearchParams(window.location.search);
    const urlsParam = params.get('urls');
    const viewer = document.getElementById('viewer');
    const headerStatus = document.getElementById('header-status');

    if (urlsParam) {
        // Очищаем контейнер
        viewer.innerHTML = '';
        const urls = urlsParam.split(',');

        urls.forEach((url, index) => {
            const img = document.createElement('img');
            img.src = url.trim();
            img.className = 'manga-page';
            // Ленивая загрузка для экономии трафика (кроме первых двух страниц)
            if (index > 1) img.loading = 'lazy'; 
            
            img.onerror = function() {
                console.error("Ошибка загрузки страницы:", url);
            };
            
            viewer.appendChild(img);
        });

        headerStatus.innerText = `СТРАНИЦ: ${urls.length}`;
    } else {
        viewer.innerHTML = '<div class="info-msg">Библиотека пуста.<br>Открой главу через бота командой /read</div>';
    }
</script>
</body>
</html>
