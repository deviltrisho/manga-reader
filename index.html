<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>FALLING READER</title>
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b0e11; --accent: #eb3349; --card: #1a1f26; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: -apple-system, system-ui, sans-serif; margin: 0; padding: 0; }
        .header { padding: 15px; background: #151921; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 100; }
        .container { padding: 15px; }
        .manga-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .manga-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #2d3748; cursor: pointer; transition: transform 0.2s; }
        .manga-card:active { transform: scale(0.98); }
        .manga-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; display: block; }
        .card-info { padding: 10px; font-size: 14px; text-align: center; font-weight: bold; }
        .reader-mode img { width: 100%; display: block; }
        .empty-msg { text-align: center; color: #718096; margin-top: 50px; font-size: 16px; line-height: 1.5; }
        .back-btn { width: 100%; padding: 20px; background: #2d3748; color: white; border: none; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight: bold; letter-spacing: 1px; color: var(--accent);">FALLING PROJECT</div>
    <div id="status-dot" style="width: 10px; height: 10px; background: #4a5568; border-radius: 50%;"></div>
</div>

<div class="container">
    <div id="catalog" class="manga-grid">
        <div class="empty-msg">Синхронизация с облаком FALLING...</div>
    </div>
    <div id="reader" style="display:none;"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const SB_URL = "https://isljrkchacvmkkfjrxve.supabase.co";
    const SB_KEY = "sb_publishable_PQaDxAaLtwXBhS0mzjFhqA_wIZiuErs";
    
    // Инициализация клиента Supabase
    const supabaseClient = supabase.createClient(SB_URL, SB_KEY);

    async function loadCatalog() {
        const catalog = document.getElementById('catalog');
        const dot = document.getElementById('status-dot');
        
        try {
            // Запрашиваем все тайтлы из таблицы titles
            const { data: titles, error } = await supabaseClient
                .from('titles')
                .select('*')
                .order('id', { ascending: false });

            if (error) throw error;

            if (!titles || titles.length === 0) {
                catalog.innerHTML = `<div class="empty-msg">В базе FALLING пока пусто.<br>Добавь проект через бота командой /add_title</div>`;
                dot.style.background = "#ecc94b"; // Желтый - база пуста
                return;
            }

            dot.style.background = "#48bb78"; // Зеленый - данные есть
            
            catalog.innerHTML = titles.map(t => `
                <div class="manga-card" onclick="openTitle(${t.id})">
                    <img src="${t.cover_url || 'https://via.placeholder.com/200x300?text=FALLING'}" onerror="this.src='https://via.placeholder.com/200x300?text=Error+Image'">
                    <div class="card-info">${t.name || 'Без названия'}</div>
                </div>
            `).join('');

        } catch (err) {
            console.error("Ошибка загрузки:", err);
            dot.style.background = "#f56565"; // Красный - ошибка
            catalog.innerHTML = `<div class="empty-msg" style="color:#f56565">Ошибка подключения!<br>${err.message}</div>`;
        }
    }

    async function openTitle(id) {
        const catalog = document.getElementById('catalog');
        const reader = document.getElementById('reader');
        
        catalog.style.display = 'none';
        reader.style.display = 'block';
        reader.innerHTML = "<div class='empty-msg'>Загрузка страниц...</div>";

        try {
            const { data: pages, error } = await supabaseClient
                .from('pages')
                .select('url')
                .eq('title_id', id)
                .order('id', { ascending: true });

            if (error) throw error;

            if (!pages || pages.length === 0) {
                reader.innerHTML = `
                    <div class="empty-msg">В этом тайтле еще нет страниц.<br>Скинь фото боту!</div>
                    <button class="back-btn" onclick="location.reload()">↩ НАЗАД</button>
                `;
                return;
            }

            reader.innerHTML = pages.map(p => `<img src="${p.url}" loading="lazy">`).join('') + 
                               `<button class="back-btn" onclick="location.reload()">↩ НАЗАД В КАТАЛОГ</button>`;
            
            window.scrollTo(0, 0);

        } catch (err) {
            reader.innerHTML = `<div class="empty-msg">Ошибка: ${err.message}</div>
                                <button class="back-btn" onclick="location.reload()">↩ НАЗАД</button>`;
        }
    }

    // Инициализация WebApp
    tg.expand();
    tg.ready();
    loadCatalog();
</script>
</body>
</html>
