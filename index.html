<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        :root { --bg: #0b0e11; --accent: #eb3349; --card: #1a1f26; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; overflow-x: hidden; }
        .header { padding: 15px; background: #151921; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2d3748; position: sticky; top: 0; z-index: 100; }
        .admin-btn { background: var(--accent); color: white; border: none; padding: 8px 12px; border-radius: 6px; font-weight: bold; display: none; }
        .container { padding: 15px; }
        .manga-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
        .manga-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #2d3748; cursor: pointer; }
        .manga-card img { width: 100%; aspect-ratio: 2/3; object-fit: cover; }
        .card-info { padding: 8px; font-size: 14px; text-align: center; font-weight: bold; }
        .reader-mode img { width: 100%; display: block; margin: 0; }
        .admin-panel { display: none; background: #1a1f26; padding: 15px; border-radius: 10px; margin-bottom: 15px; border: 1px solid var(--accent); }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; background: #0b0e11; border: 1px solid #2d3748; color: white; border-radius: 5px; box-sizing: border-box; }
        .btn-save { background: #28a745; color: white; width: 100%; padding: 12px; border: none; border-radius: 5px; font-weight: bold; cursor: pointer; }
        .page-item { position: relative; width: 100%; }
        .btn-delete-page { position: absolute; top: 10px; right: 10px; background: rgba(235, 51, 73, 0.9); color: white; border: none; padding: 8px; border-radius: 5px; z-index: 5; }
    </style>
</head>
<body>

<div class="header">
    <div style="font-weight: bold; letter-spacing: 1px;">FALLING PROJECT</div>
    <button id="adminToggle" class="admin-btn" onclick="toggleAdmin()">⚙️ АДМИН</button>
</div>

<div class="container">
    <div id="adminArea" class="admin-panel">
        <h3>Управление проектом</h3>
        <input type="text" id="edit_name" placeholder="Название">
        <input type="text" id="edit_cover" placeholder="URL обложки (ImgBB)">
        <textarea id="edit_desc" placeholder="Описание проекта"></textarea>
        <button class="btn-save" onclick="saveTitleInfo()">ОБНОВИТЬ ДАННЫЕ</button>
    </div>

    <div id="catalog" class="manga-grid"></div>
    <div id="reader" class="reader-mode" style="display:none;"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    const SB_URL = "https://isljrkchacvmkkfjrxve.supabase.co";
    const SB_KEY = "sb_publishable_PQaDxAaLtwXBhS0mzjFhqA_wIZiuErs";
    const supabase = window.supabase.createClient(SB_URL, SB_KEY);

    const ADMIN_ID = 5961270858;
    let currentUserId = tg.initDataUnsafe?.user?.id;
    let selectedTitleId = null;

    async function init() {
        tg.expand();
        if (currentUserId === ADMIN_ID) {
            document.getElementById('adminToggle').style.display = 'block';
        }
        loadCatalog();
    }

    async function loadCatalog() {
        const { data: titles, error } = await supabase.from('titles').select('*');
        const catalog = document.getElementById('catalog');
        if (error) { catalog.innerHTML = "Ошибка подключения к облаку"; return; }
        
        catalog.innerHTML = titles.map(t => `
            <div class="manga-card" onclick="openTitle(${t.id}, '${t.name}')">
                <img src="${t.cover_url || 'https://via.placeholder.com/200x300?text=FALLING'}" alt="">
                <div class="card-info">${t.name}</div>
            </div>
        `).join('');
    }

    async function openTitle(id, name) {
        selectedTitleId = id;
        document.getElementById('catalog').style.display = 'none';
        const reader = document.getElementById('reader');
        reader.innerHTML = "<div style='text-align:center'>Загрузка страниц...</div>";
        reader.style.display = 'block';
        
        const { data: pages } = await supabase.from('pages').select('*').eq('title_id', id).order('id', { ascending: true });
        
        reader.innerHTML = pages.map(p => `
            <div class="page-item" id="p-${p.id}">
                <img src="${p.url}">
                ${currentUserId === ADMIN_ID ? `<button class="btn-delete-page" onclick="deletePage(${p.id})">Удалить страницу</button>` : ''}
            </div>
        `).join('') + `<button class="btn-save" style="background:#555; margin-top:20px;" onclick="location.reload()">↩ НАЗАД В КАТАЛОГ</button>`;
    }

    async function deletePage(id) {
        if(confirm('Удалить эту страницу навсегда?')) {
            await supabase.from('pages').delete().eq('id', id);
            document.getElementById(`p-${id}`).remove();
        }
    }

    function toggleAdmin() {
        const area = document.getElementById('adminArea');
        area.style.display = area.style.display === 'block' ? 'none' : 'block';
    }

    async function saveTitleInfo() {
        if(!selectedTitleId) { alert("Сначала выбери тайтл в каталоге!"); return; }
        const name = document.getElementById('edit_name').value;
        const cover = document.getElementById('edit_cover').value;
        const desc = document.getElementById('edit_desc').value;

        const updateData = {};
        if(name) updateData.name = name;
        if(cover) updateData.cover_url = cover;
        if(desc) updateData.description = desc;

        await supabase.from('titles').update(updateData).eq('id', selectedTitleId);
        alert('Данные FALLING обновлены!');
        location.reload();
    }

    init();
</script>
</body>
</html>
