<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    <style>
        :root { --bg: #0b0e11; --card: #151921; --accent: #0088cc; --text: #ffffff; }
        body { background: var(--bg); color: var(--text); font-family: sans-serif; margin: 0; padding: 0; }
        header { padding: 15px; background: var(--card); border-bottom: 1px solid #2d3748; text-align: center; position: sticky; top: 0; }
        .container { padding: 15px; display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .manga-card { background: var(--card); border-radius: 10px; overflow: hidden; border: 1px solid #2d3748; }
        .manga-card img { width: 100%; height: 180px; object-fit: cover; }
        .manga-info { padding: 8px; font-size: 14px; font-weight: bold; }
        
        #reader { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: #000; z-index: 100; overflow-y: auto; }
        .reader-img { width: 100%; display: block; }
        .back-btn { position: fixed; top: 10px; left: 10px; background: rgba(0,0,0,0.7); color: #fff; border: none; padding: 8px 15px; border-radius: 20px; z-index: 101; }
    </style>
</head>
<body>

<header id="header-title">ARCANUM LIBRARY</header>

<div class="container" id="library">
    </div>

<div id="reader">
    <button class="back-btn" onclick="closeReader()">← Назад</button>
    <div id="pages-list"></div>
</div>

<script>
    const tg = window.Telegram.WebApp;
    tg.expand();

    // Получаем данные, которые бот передал через URL (StartParam)
    const urlParams = new URLSearchParams(window.location.search);
    const mode = urlParams.get('mode'); 

    // Функция отрисовки страниц
    function openReader(urlsString) {
        const urls = urlsString.split(',');
        const container = document.getElementById('pages-list');
        container.innerHTML = '';
        urls.forEach(url => {
            const img = document.createElement('img');
            img.src = url;
            img.className = 'reader-img';
            container.appendChild(img);
        });
        document.getElementById('reader').style.display = 'block';
    }

    function closeReader() {
        document.getElementById('reader').style.display = 'none';
    }

    // Имитация получения данных (в следующей итерации сделаем через бот-инвойс)
    // Сейчас просто создаем тестовую карточку для проверки
    const library = document.getElementById('library');
    library.innerHTML = `
        <div class="manga-card" onclick="openReader('https://telegra.ph/file/hash1.jpg,https://telegra.ph/file/hash2.jpg')">
            <img src="https://via.placeholder.com/200x300?text=Cover" alt="">
            <div class="manga-info">Нажми, чтобы проверить ридер</div>
        </div>
    `;
</script>
</body>
</html>
